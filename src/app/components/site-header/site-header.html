@let onPhoto = !scrolled() && !menuOpen();

<a
  href="#contenido"
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-2 focus:font-semibold"
>
  Saltar al contenido
</a>

<header
  class="fixed top-0 z-40 w-full transition-all duration-300"
  [class]="
    onPhoto ? 'bg-transparent' : 'border-b border-border bg-background/90 shadow-sm backdrop-blur-md'
  "
>
  <div class="mx-auto flex w-full max-w-[1600px] items-center justify-between px-6 py-6 lg:px-20">
    <!-- Izquierda: navegación en escritorio, botón de menú en móvil -->
    <div class="flex flex-1 items-center">
      <nav class="hidden gap-8 md:flex" aria-label="Principal">
        @for (link of links; track link.href) {
          <!-- `aria-current="location"` es el valor para "aquí es donde estás
               dentro de la página"; `page` diría que es otra página distinta.
               El subrayado permanente acompaña al color: la sección activa no
               puede distinguirse solo por el tono. -->
          <a
            [href]="link.href"
            [attr.aria-current]="isCurrent(link.href) ? 'location' : null"
            class="link-underline whitespace-nowrap text-xs font-semibold uppercase tracking-[0.15em] transition-colors duration-300"
            [class]="onPhoto ? 'text-white/90 hover:text-white' : 'text-ink-muted hover:text-brand'"
            [class.is-current]="isCurrent(link.href)"
            [class.text-brand]="isCurrent(link.href) && !onPhoto"
            [class.text-white]="isCurrent(link.href) && onPhoto"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <button
        type="button"
        (click)="toggleMenu()"
        class="-ml-2.5 inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-lg transition-colors duration-300 md:hidden"
        [class]="onPhoto ? 'text-white hover:bg-white/10' : 'text-ink hover:bg-surface-alt'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="menu-movil"
        [attr.aria-label]="menuOpen() ? 'Cerrar el menú' : 'Abrir el menú'"
      >
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6L6 18" />
          } @else {
            <path d="M3 6h18M3 12h18M3 18h18" />
          }
        </svg>
      </button>
    </div>

    <div class="flex-1 text-center">
      <a
        href="#"
        class="font-display text-2xl tracking-tight transition-colors duration-300 sm:text-3xl"
        [class]="onPhoto ? 'text-white' : 'text-brand'"
      >
        ALTURA
      </a>
    </div>

    <div class="flex flex-1 items-center justify-end gap-2">
      <button
        type="button"
        (click)="theme.toggle()"
        class="inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-lg transition-colors duration-300"
        [class]="onPhoto ? 'text-white hover:bg-white/10' : 'text-ink hover:bg-surface-alt'"
        [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
        [attr.aria-pressed]="theme.isDark()"
      >
        @if (theme.isDark()) {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Menú móvil. Se cierra al pulsar un enlace: dejarlo abierto taparía justo
       la sección a la que se acaba de saltar. -->
  @if (menuOpen()) {
    <nav
      id="menu-movil"
      aria-label="Principal"
      class="border-t border-border bg-background px-6 py-4 md:hidden"
    >
      <ul class="flex flex-col">
        @for (link of links; track link.href) {
          <li>
            <!-- El borde izquierdo existe siempre y solo cambia de color: si
                 apareciera al activarse, el texto daría un salto lateral. -->
            <a
              [href]="link.href"
              (click)="closeMenu()"
              [attr.aria-current]="isCurrent(link.href) ? 'location' : null"
              class="block border-b border-l-2 border-b-border py-4 pl-4 text-sm font-semibold uppercase tracking-[0.15em] transition-colors hover:text-brand"
              [class]="isCurrent(link.href) ? 'border-l-brand text-brand' : 'border-l-transparent text-ink'"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
